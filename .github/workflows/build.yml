name: OQS Demos

on:
  workflow_call:
    inputs:
      build_main:
        description: "Build using liboqs and oqsprovider main branches"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Which docker tag to push to"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      build_main:
        description: "Build using liboqs and oqsprovider main branches"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Which docker tag to push to"
        required: false
        type: string
  schedule: # run with "build_main: true" weekly on Mon at 1:01
    - cron: '1 1 * * 1'

jobs:
  curl:
    uses: ./.github/workflows/curl.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  h2load:
    uses: ./.github/workflows/h2load.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  haproxy:
    if: false
    uses: ./.github/workflows/haproxy.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  httpd:
    uses: ./.github/workflows/httpd.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  locust:
    uses: ./.github/workflows/locust.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  mosquitto:
    if: false
    uses: ./.github/workflows/mosquitto.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  nginx:
    uses: ./.github/workflows/nginx.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  ngtcp2:
    if: false
    uses: ./.github/workflows/ngtcp2.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  openssh:
    if: false
    uses: ./.github/workflows/openssh.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  openssl3:
    uses: ./.github/workflows/openssl3.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  openvpn:
    if: false
    uses: ./.github/workflows/openvpn.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  nodejs:
    uses: ./.github/workflows/nodejs.yml
    secrets: inherit
    with:
        build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
        release_tag: ${{ inputs.release_tag }}

  postgresql:
    uses: ./.github/workflows/postgresql.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  wireshark:
    uses: ./.github/workflows/wireshark.yml
    secrets: inherit
    with:
      build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
      release_tag: ${{ inputs.release_tag }}

  epiphany:
    uses: ./.github/workflows/epiphany.yml
    secrets: inherit
    with:
        build_main: ${{ !contains(inputs.build_main == 'true', 'false') }}
        release_tag: ${{ inputs.release_tag }}

  report-integration-failures:
    needs:
      - curl
      - h2load
      - httpd
      - locust
      - nginx
      - openssl3
      - nodejs
      - postgresql
      - wireshark
      - epiphany
    if: >-
      ${{ always() && !cancelled() &&
          contains(needs.*.result, 'failure') &&
          github.repository == 'open-quantum-safe/oqs-demos' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.build_main == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: upstream-integration-reports
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report upstream integration failures
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_ISSUES_TOKEN: ${{ secrets.UPSTREAM_ISSUES_TOKEN }}
          UPSTREAM_ISSUE_ROUTES: ${{ vars.UPSTREAM_ISSUE_ROUTES }}
          CANARY_BUILD: ${{ github.event_name == 'schedule' || inputs.build_main == true }}
        run: python3 scripts/report-integration-failures.py
